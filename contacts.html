<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts — Leo Efimoff</title>
<meta name="description" content="Contact Leo Efimoff about sculpture, commissions and available works.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#111; --muted:#8a8a8a; --line:#ececec; --gutter:clamp(16px,4vw,56px); --gap:clamp(16px,2.4vw,40px); --max:1680px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:300 15px/1.7 "Inter",system-ui,-apple-system,sans-serif; letter-spacing:.01em; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible { outline:1px solid var(--ink); outline-offset:5px; }
  .wrap { max-width:var(--max); margin:0 auto; padding:0 var(--gutter); }
  header { margin-top:calc(0.4in * 2 / 3); position:sticky; top:0; z-index:10; background:rgba(255,255,255,.94); backdrop-filter:blur(8px); }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:76px; }
  .name { font-weight:400; font-size:42px; letter-spacing:.24em; text-transform:uppercase; white-space:nowrap; }
  nav { display:flex; align-items:center; gap:clamp(16px,3vw,40px); font-size:13px; }
  nav a,.lang { color:var(--muted); transition:color .2s; }
  nav a:hover,nav [aria-current="page"],.lang:hover,.lang[aria-pressed="true"] { color:var(--ink); }
  .langs { color:var(--line); }
  main { padding-top:clamp(30px,4.5vw,66px)!important; padding-bottom:clamp(32px,3vw,48px)!important; }
  .contact-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(32px,7vw,112px); align-items:start; }
  .contact-layout figure { width:100%; max-width:600px; }
  figure { min-width:0; }
  figure img { display:block; width:100%; height:auto; background:#f2f2f2; }
  .contact-copy { max-width:540px; padding:0; }
  .label { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:24px; }
  .contact-copy > p { color:#575757; font-size:clamp(15px,1.3vw,17px); max-width:420px; }
  .direct { margin-top:clamp(24px,3vw,36px); font-size:13px; }
  .direct li { list-style:none; margin-bottom:8px; color:var(--muted); display:flex; align-items:center; gap:10px; }
  .direct .icon { display:block; flex:none; color:var(--muted); transition:color .2s; }
  .direct .icon svg { display:block; width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1; stroke-linecap:round; stroke-linejoin:round; }
  .direct li:hover .icon { color:var(--ink); }
  .direct a { border-bottom:1px solid var(--line); transition:border-color .2s; }
  .direct a:hover { border-color:var(--ink); }
  form { margin-top:clamp(28px,4vw,44px); }
  .field { margin-bottom:22px; }
  form label { display:block; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  form input, form textarea {
    width:100%; border:0; border-bottom:1px solid var(--line); border-radius:0;
    background:transparent; color:var(--ink); font:inherit; padding:8px 0 10px;
    transition:border-color .2s; -webkit-appearance:none; appearance:none;
  }
  form textarea { resize:vertical; min-height:96px; }
  form input:focus, form textarea:focus { border-color:var(--ink); outline:none; }
  form ::placeholder { color:#bcbcbc; }
  .send { margin-top:8px; font-size:13px; border-bottom:1px solid var(--ink); padding-bottom:2px; transition:opacity .2s; }
  .send:hover { opacity:.55; }
  .form-note { margin-top:18px; font-size:12px; color:var(--muted); min-height:1.2em; }
  .counter { margin-top:6px; font-size:11px; letter-spacing:.08em; color:var(--muted); text-align:right; }
  .counter.full { color:#b23b3b; }
  footer { border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  footer .wrap { padding-top:32px; padding-bottom:32px; }
  @media(max-width:760px) { .contact-layout { grid-template-columns:minmax(0,1fr); gap:24px; } .contact-layout figure { max-width:none; } }
  @media(max-width:560px) {
    .name { font-size:clamp(26px,8.8vw,42px); letter-spacing:.04em; }
    header .wrap { flex-direction:column; align-items:flex-start; justify-content:center; gap:4px; height:auto; padding-top:16px; padding-bottom:14px; }
    nav { width:100%; gap:20px; }
    nav .langs { margin-left:auto; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="name" href="index.html">Leo Efimoff</a>
    <nav aria-label="Main navigation">
      <a href="index.html" data-i18n="nav_works">Works</a>
      <a href="about.html" data-i18n="nav_about">About</a>
      <a href="contacts.html" aria-current="page" data-i18n="nav_contacts">Contacts</a>
      <span class="langs"><button class="lang" data-lang="en" aria-pressed="true">EN</button> / <button class="lang" data-lang="es" aria-pressed="false">ES</button></span>
    </nav>
  </div>
</header>
<main class="wrap">
  <section class="contact-layout" aria-label="Contacts">
    <figure>
      <img src="images/contacts/leo-portrait-bw.webp" srcset="images/contacts/leo-portrait-bw-480.webp 480w, images/contacts/leo-portrait-bw.webp 1170w" sizes="(max-width:760px) 100vw, 50vw" width="1170" height="1455" alt="Portrait of Leo Efimoff behind a pile of long tubular sculptures." fetchpriority="high" decoding="async">
    </figure>
    <div class="contact-copy">
      <div class="label" data-i18n="nav_contacts">Contacts</div>
      <p data-i18n="intro">For available works, commissions and ordering, write directly or use the form.</p>

      <!-- Email is still a placeholder. -->
      <ul class="direct">
        <li>
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.1" cy="6.9" r=".9"/></svg></span>
          <a href="https://www.instagram.com/leoefimoff/" target="_blank" rel="noopener" aria-label="Instagram — @leoefimoff">@leoefimoff</a>
        </li>
        <li>
          <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="1.8"/><path d="m3.2 7.1 8.8 6.3 8.8-6.3"/></svg></span>
          <a href="mailto:leo@leoefimoff.com" aria-label="Email — leo@leoefimoff.com">leo@leoefimoff.com</a>
        </li>
      </ul>

      <form id="contact-form" novalidate>
        <div class="field">
          <label for="name" data-i18n="lbl_name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
        </div>
        <div class="field">
          <label for="email" data-i18n="lbl_email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required>
        </div>
        <div class="field">
          <label for="message" data-i18n="lbl_message">Message</label>
          <textarea id="message" name="message" rows="4" maxlength="2000" required></textarea>
          <div class="counter" id="message-counter" aria-live="off">0 / 2000</div>
        </div>
        <button class="send" type="submit" data-i18n="send">Send</button>
        <div class="form-note" id="form-note" role="status" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>
<footer><div class="wrap">© <span id="year"></span> Leo Efimoff</div></footer>
<script>
  const TEXT = {
    en: {
      nav_works:"Works", nav_about:"About", nav_contacts:"Contacts",
      intro:"For available works, commissions and ordering, write directly or use the form.",
      lbl_name:"Name", lbl_email:"Email", lbl_message:"Message", send:"Send",
      note_missing:"Please fill in your name, email and message.",
      note_sent:"Thank you. The form isn’t connected to a mail service yet, so nothing was sent — please write to leo@leoefimoff.com."
    },
    es: {
      nav_works:"Obras", nav_about:"Sobre el artista", nav_contacts:"Contacto",
      intro:"Para obras disponibles, encargos y pedidos, escriba directamente o use el formulario.",
      lbl_name:"Nombre", lbl_email:"Correo", lbl_message:"Mensaje", send:"Enviar",
      note_missing:"Por favor, complete su nombre, correo y mensaje.",
      note_sent:"Gracias. El formulario aún no está conectado a un servicio de correo, así que no se envió nada — escriba a leo@leoefimoff.com."
    }
  };
  let lang="en";
  let noteState=null;
  try { lang=localStorage.getItem("lang") || (navigator.language.startsWith("es")?"es":"en"); } catch(e) {}
  if(!TEXT[lang]) lang="en";
  function renderNote() {
    const note=document.getElementById("form-note");
    note.textContent = noteState ? TEXT[lang][noteState] : "";
  }
  function setLang(language) {
    if(!TEXT[language]) return;
    lang=language;
    try { localStorage.setItem("lang",lang); } catch(e) {}
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-i18n]").forEach(element=>{element.textContent=TEXT[lang][element.dataset.i18n];});
    document.querySelectorAll(".lang").forEach(button=>button.setAttribute("aria-pressed",button.dataset.lang===lang));
    renderNote();
  }
  document.querySelectorAll(".lang").forEach(button=>{button.onclick=()=>setLang(button.dataset.lang);});
  document.getElementById("year").textContent=new Date().getFullYear();

  // Editable limit lives in one place: the maxlength attribute on the textarea.
  const messageEl=document.getElementById("message");
  const counterEl=document.getElementById("message-counter");
  const maxLen=messageEl.maxLength;
  function renderCounter(){
    const n=messageEl.value.length;
    counterEl.textContent=`${n} / ${maxLen}`;
    counterEl.classList.toggle("full", n>=maxLen);
  }
  messageEl.addEventListener("input", renderCounter);
  renderCounter();

  // No backend yet: the form validates locally and reports that nothing was sent.
  document.getElementById("contact-form").addEventListener("submit", event => {
    event.preventDefault();
    const form=event.currentTarget;
    const filled=["name","email","message"].every(id=>form.elements[id].value.trim()!=="");
    noteState = filled ? "note_sent" : "note_missing";
    renderNote();
  });
  setLang(lang);
</script>
</body>
</html>
